apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-limit-inference
  namespace: card-approval-training
  labels:
    app: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      serviceAccountName: training-sa
      containers:
      - name: inference-container
        image: YOUR_ARTIFACT_REGISTRY/credit-limit-training:latest
        command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8080"]
        env:
        - name: PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: pipeline-config
              key: project_id
        ports:
        - containerPort: 8080
          name: web
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
      volumes:
      - name: model-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: credit-limit-inference
  namespace: card-approval-training
spec:
  selector:
    app: inference
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    name: http
  type: LoadBalancer
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: inference-monitoring
  namespace: card-approval-training
spec:
  selector:
    matchLabels:
      app: inference
  endpoints:
  - port: web
    path: /metrics
    interval: 10s
