global:
  scrape_interval: 5s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ['vllm:8000']

  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: myapp
    metrics_path: /metrics
    static_configs:
      - targets: ['myapp:80']