services:
  vllm:
    image: vllm/vllm-openai-cpu:latest-x86_64
    container_name: case2-vllm
    command: --config /recipe/vllm-config.yaml
    environment:
      - VLLM_CPU_KVCACHE_SPACE=2          # KV cache budget in GB (your notes!)
    volumes:
      - ./vllm-config.yaml:/recipe/vllm-config.yaml:ro
      - ~/.cache/huggingface:/root/.cache/huggingface   # model weights persist
    ports:
      - "8000:8000"                        # vLLM's own API (you can hit it directly too)
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s                   # first pull of the model takes a while

  myapp:
    build: ./app                           # builds from app/Dockerfile
    container_name: case2-myapp
    ports:
      - "8080:80"                          # YOUR app's port (public)
    environment:
      - VLLM_URL=http://vllm:8000/v1       # service name, NOT localhost
      - API_KEY=${API_KEY:-secret-key}     # for your app's own auth (optional)
    depends_on:
      vllm:
        condition: service_healthy         # wait until vLLM is actually up

  prometheus:
    image: prom/prometheus:latest
    container_name: case2-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      vllm:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: case2-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: case2-node-exporter
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'