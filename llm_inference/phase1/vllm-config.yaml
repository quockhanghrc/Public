# vLLM server configuration (passed to: vllm serve --config ...)
model: Qwen/Qwen2.5-0.5B-Instruct
served-model-name: chat-model              # what clients call it in requests

# Precision / memory (your notes: quantization topic)
dtype: bfloat16
max-model-len: 2048                        # context cap → bounds KV cache
quantization: awq

# Batching / throughput (your notes: latency-throughput tradeoff)
max-num-seqs: 16                           # ceiling on concurrent requests
max-num-batched-tokens: 2048               # token budget per step

# Speedups (your notes: prefix caching)
enable-prefix-caching: true

# API
host: 0.0.0.0
port: 8000
