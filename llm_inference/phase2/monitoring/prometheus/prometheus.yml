# Phase2 monitoring: scrape the two Modal services.
#
# The Modal web endpoints are public HTTPS URLs. Set these env vars when
# starting the stack (see docker-compose.yaml):
#   VLLM_METRICS_HOST  e.g. your-workspace--phase2-vllm-gpu-serve.modal.run
#   API_METRICS_HOST   e.g. your-workspace--phase2-api-web.modal.run
#   SCRAPE_SCHEME      http (for local/phase1 testing) or https (Modal, default)
#
# Prometheus expands ${VAR} at load time; ${VAR:-default} provides fallbacks.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: vllm
    scheme: ${SCRAPE_SCHEME:-https}
    metrics_path: /metrics
    static_configs:
      - targets: ["${VLLM_METRICS_HOST}"]

  - job_name: myapp
    scheme: ${SCRAPE_SCHEME:-https}
    metrics_path: /metrics
    static_configs:
      - targets: ["${API_METRICS_HOST}"]