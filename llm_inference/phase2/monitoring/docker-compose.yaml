# Separately-hosted monitoring for the phase2 Modal deployment.
#
# Prometheus scrapes the two Modal web endpoints (/metrics) and Grafana serves
# the phase1 dashboard plus the new GPU / container panels.
#
# Usage:
#   export VLLM_METRICS_HOST=<workspace>--phase2-vllm-gpu-serve.modal.run
#   export API_METRICS_HOST=<workspace>--phase2-api-web.modal.run
#   docker compose up -d
#
# Grafana: http://localhost:3000 (admin / $GF_ADMIN_PASSWORD, default admin)

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: phase2-prometheus
    environment:
      - VLLM_METRICS_HOST=${VLLM_METRICS_HOST:?set to the vLLM Modal host}
      - API_METRICS_HOST=${API_METRICS_HOST:?set to the API Modal host}
      - SCRAPE_SCHEME=${SCRAPE_SCHEME:-https}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: phase2-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus